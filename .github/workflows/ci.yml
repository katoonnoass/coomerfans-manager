name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: |
          pnpm --filter @coomerfans/backend db:generate
          pnpm --filter @coomerfans/worker db:generate

      - name: Prisma validate
        run: pnpm validate

      - name: Typecheck
        run: |
          pnpm --filter @coomerfans/backend typecheck
          pnpm --filter @coomerfans/worker typecheck
          pnpm --filter @coomerfans/frontend typecheck

      - name: Frontend build
        run: pnpm --filter @coomerfans/frontend build
