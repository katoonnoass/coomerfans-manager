services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: coomerfans
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coomerfans"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/coomerfans?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: change-me-access-secret-min-32-chars
      JWT_REFRESH_SECRET: change-me-refresh-secret-min-32-chars
      PORT: 3001
      CORS_ORIGIN: http://localhost:5173
      MEDIA_PATH: /app/media
      IDM_IMPORT_BASE_URL: http://localhost:3001
    ports:
      - "3001:3001"
    volumes:
      - media-data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: packages/worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/coomerfans?schema=public
      REDIS_URL: redis://redis:6379
      MEDIA_PATH: /app/media
      SCRAPER_USER_AGENT: Mozilla/5.0
    volumes:
      - media-data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    environment:
      VITE_API_BASE_URL: /api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres-data:
  redis-data:
  media-data:
